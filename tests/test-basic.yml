name: Test basic usage - QR code comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          comment: "Scan this QR code to preview: {qrcode}"
          content: "https://example.com/preview"
        continue-on-error: true
      - name: Assert action ran with required inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail because there is no real PR to comment on,
          # but it should not fail due to missing inputs.
          # A failure due to missing inputs would show 'failure' before even
          # attempting the API call. We accept both 'success' and 'failure'
          # as long as the action was invoked with the required inputs.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with comment and content inputs"
