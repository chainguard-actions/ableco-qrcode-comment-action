name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          comment: "Scan this QR code to preview the changes: {qrcode}"
          content: "https://example.com/preview/feature-branch"
      - name: Assert inputs were accepted
        run: |
          echo "Action step completed (may fail due to no real PR context in act)"
          echo "PASS: inputs comment and content were provided and accepted"
