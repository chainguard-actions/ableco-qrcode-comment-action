name: Test comment without qrcode placeholder
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with comment that has no qrcode placeholder
        id: action
        uses: .
        with:
          comment: "This comment has no placeholder."
          content: "https://example.com"
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail because there is no PR in workflow_dispatch context,
          # but it should not crash with a missing-module or syntax error.
          # Acceptable outcomes: success (unlikely without PR) or failure (no PR found).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a deterministic outcome ($OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
